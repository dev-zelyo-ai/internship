<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dapp University | Todo List</title>

    <!-- Bootstrap CSS -->
    <link href="vendor/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      main { margin-top: 60px; }
      #content { display: none; }
      form { width: 350px; margin-bottom: 10px; }
      ul { margin-bottom: 0px; }
      #completedTaskList .content {
        color: grey;
        text-decoration: line-through;
      }
      .taskTemplate { display: none; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark fixed-top bg-dark flex-md-nowrap p-0 shadow">
      <a class="navbar-brand col-sm-3 col-md-2 mr-0" href="https://www.rescape.io" target="_blank">
        Rescape Technology | Todo List
      </a>
      <ul class="navbar-nav px-3">
        <li class="nav-item text-nowrap d-none d-sm-block">
          <small><a class="nav-link" href="#"><span id="account"></span></a></small>
        </li>
      </ul>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <main role="main" class="col-lg-12 d-flex justify-content-center">
          <div id="loader" class="text-center">
            <p class="text-center">Loading...</p>
          </div>
          <div id="content">
            <form onsubmit="App.createTask(); return false;">
              <input
                id="newTask"
                type="text"
                class="form-control"
                placeholder="Add task..."
                required
              />
            </form>

            <ul id="taskList" class="list-unstyled"></ul>
            <ul id="completedTaskList" class="list-unstyled"></ul>
          </div>
        </main>
      </div>
    </div>

    <!-- Hidden template for cloning -->
    <div class="taskTemplate checkbox">
      <label>
        <input type="checkbox" />
        <span class="content">Task content goes here...</span>
      </label>
    </div>

    <!-- Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@^1.0.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/truffle-contract/dist/truffle-contract.min.js"></script>

    <!-- App -->
    <script src="app.js"></script>
    <script>
      // Kick off the DApp once everything is loaded
      $(window).on('load', App.load);
    </script>
  </body>
</html>
